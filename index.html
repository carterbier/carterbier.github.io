<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0c">
  <meta name="description" content="Carter's photography portfolio.">
  <title>Carter's Photos</title>
  <link rel="stylesheet" href="style.css">
  <!-- deployment refresh -->
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Carter's Photos home">CARTER’S PHOTOS</a>
      <nav class="nav" aria-label="Primary navigation">
        <a class="nav-link active" href="/">PHOTOS</a>
        <span class="nav-link nav-placeholder" aria-disabled="true">ABOUT</span>
      </nav>
    </header>

    <section class="gallery" aria-label="Photo gallery">
      <a class="photo" href="images/p3620089-2.jpg" target="_blank" rel="noopener">
        <img src="images/p3620089-2.jpg" alt="The moon against a dark night sky" loading="eager" decoding="async">
      </a>
      <a class="photo photo-squirrel" href="images/p3880610.jpg" target="_blank" rel="noopener">
        <img src="images/p3880610.jpg" alt="Squirrel portrait" loading="eager" decoding="async">
      </a>
      <a class="photo" href="images/p1350046.jpg" target="_blank" rel="noopener">
        <img src="images/p1350046.jpg" alt="Solar eclipse" loading="lazy" decoding="async">
      </a>
      <a class="photo" href="images/p3380422.jpg" target="_blank" rel="noopener">
        <img src="images/p3380422.jpg" alt="American robin portrait" loading="lazy" decoding="async">
      </a>
      <a class="photo" href="images/p3610479-2.jpg" target="_blank" rel="noopener">
        <img src="images/p3610479-2.jpg" alt="Pink flower" loading="lazy" decoding="async">
      </a>
      <a class="photo" href="images/p2930012-4.jpg" target="_blank" rel="noopener">
        <img src="images/p2930012-4.jpg" alt="Mourning doves" loading="lazy" decoding="async">
      </a>
      <a class="photo" href="images/p3000961-4.jpg" target="_blank" rel="noopener">
        <img src="images/p3000961-4.jpg" alt="Blue jay portrait" loading="lazy" decoding="async">
      </a>
      <a class="photo" href="images/p3610771.jpg" target="_blank" rel="noopener">
        <img src="images/p3610771.jpg" alt="Pink flower against a blue background" loading="lazy" decoding="async">
      </a>
    </section>
  </main>
</body>
</html>
