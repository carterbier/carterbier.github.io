<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0c">
  <meta name="description" content="Carter's photography portfolio.">
  <title>Carter's Photos</title>
  <link rel="stylesheet" href="style.css">
  <!-- deployment refresh -->
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Carter's Photos home">CARTER’S PHOTOS</a>
      <nav class="nav" aria-label="Primary navigation">
        <details class="nav-menu">
          <summary class="nav-current"><span class="nav-link active">HOME</span><span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span></summary>
          <div class="nav-dropdown">
            <a class="nav-link" href="/animals/">ANIMALS</a>
            <a class="nav-link" href="/other/">OTHER</a>
          </div>
        </details>
      </nav>
    </header>

    <section class="gallery" aria-label="Photo gallery">
      <button class="photo" type="button" data-full="images/home/p3620089-2.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3620089-2.jpg" alt="The moon against a dark night sky" loading="eager" decoding="async">
      </button>
      <button class="photo photo-squirrel" type="button" data-full="images/home/p3880610.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3880610.jpg" alt="Squirrel portrait" loading="eager" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p1350046.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p1350046.jpg" alt="Solar eclipse" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p3380422.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3380422.jpg" alt="American robin portrait" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p3610479-2.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3610479-2.jpg" alt="Pink flower" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p2930012-4.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p2930012-4.jpg" alt="Mourning doves" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p3000961-4.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3000961-4.jpg" alt="Blue jay portrait" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p3610771.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3610771.jpg" alt="Pink flower against a blue background" loading="lazy" decoding="async">
      </button>
    </section>

    <dialog class="lightbox" id="lightbox" aria-label="Enlarged photograph">
      <button class="lightbox-close" type="button" aria-label="Close enlarged photograph">×</button>
      <img class="lightbox-image" src="" alt="">
    </dialog>
  </main>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = lightbox.querySelector('.lightbox-image');
    const closeButton = lightbox.querySelector('.lightbox-close');

    document.querySelectorAll('.photo').forEach((photo) => {
      photo.addEventListener('click', () => {
        const image = photo.querySelector('img');
        lightboxImage.src = photo.dataset.full;
        lightboxImage.alt = image.alt;
        lightbox.showModal();
        document.documentElement.classList.add('lightbox-open');
        document.body.classList.add('lightbox-open');
      });
    });

    const closeLightbox = () => {
      lightbox.close();
      document.documentElement.classList.remove('lightbox-open');
      document.body.classList.remove('lightbox-open');
    };
    closeButton.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    lightbox.addEventListener('close', () => {
      document.documentElement.classList.remove('lightbox-open');
      document.body.classList.remove('lightbox-open');
    });
  </script>
</body>
</html>
