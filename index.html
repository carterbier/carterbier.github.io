<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0c">
  <meta name="description" content="Carter's photography portfolio.">
  <title>Carter's Photos</title>
  <link rel="icon" type="image/svg+xml" href="/eclipse-favicon.svg?v=5">
  <link rel="apple-touch-icon" href="/eclipse-favicon.svg?v=5">
  <link rel="stylesheet" href="style.css">
  <!-- deployment refresh -->
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Carter's Photos home"><img class="brand-icon" src="/eclipse-favicon.svg?v=5" alt="" aria-hidden="true">CARTER’S PHOTOS</a>
      <nav class="nav" aria-label="Primary navigation">
        <details class="nav-menu">
          <summary class="nav-current"><span class="nav-link active">HOME</span><span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span></summary>
          <div class="nav-dropdown">
            <a class="nav-link" href="/animals/"><span>ANIMALS</span><span class="nav-arrow" aria-hidden="true">›</span></a>
            <a class="nav-link" href="/other/"><span>OTHER</span><span class="nav-arrow" aria-hidden="true">›</span></a>
          </div>
        </details>
      </nav>
    </header>

    <section class="gallery" aria-label="Photo gallery">
      <button class="photo" type="button" data-full="images/home/p3620089-2.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3620089-2.jpg" alt="The moon against a dark night sky" loading="eager" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p1350046.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p1350046.jpg" alt="Solar eclipse" loading="eager" decoding="async">
      </button>
      <button class="photo photo-squirrel" type="button" data-full="images/home/p3880610.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3880610.jpg" alt="Squirrel portrait" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/P2450784.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/P2450784.jpg" alt="Wildlife photograph" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p3380422.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3380422.jpg" alt="American robin portrait" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p3000961-4.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p3000961-4.jpg" alt="Blue jay portrait" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/P1270848%20(1).jpg" aria-label="Open enlarged photograph">
        <img src="images/home/P1270848%20(1).jpg" alt="Airplane silhouetted against an orange sunset" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/p2930012-4.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/p2930012-4.jpg" alt="Mourning doves" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/P1290995-2.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/P1290995-2.jpg" alt="Silhouetted tree beside a lake at sunset" loading="lazy" decoding="async">
      </button>
      <button class="photo" type="button" data-full="images/home/P3610587-3.jpg" aria-label="Open enlarged photograph">
        <img src="images/home/P3610587-3.jpg" alt="Pink flower against a blue background" loading="lazy" decoding="async">
      </button>
    </section>

    <dialog class="lightbox" id="lightbox" aria-label="Enlarged photograph">
      <button class="lightbox-close" type="button" aria-label="Close enlarged photograph">×</button>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photograph">‹</button>
      <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photograph">›</button>
      <img class="lightbox-image" src="" alt="">
      <output class="lightbox-counter" aria-live="off"></output>
    </dialog>
  </main>

  <script src="/gallery.js" defer></script>
</body>
</html>
