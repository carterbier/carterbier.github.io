name: Optimize gallery photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-gallery.yml'
      - 'scripts/optimize_gallery.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/optimize_gallery.py
      - name: Commit optimized images and remove unused originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images index.html animals/index.html other/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Optimize gallery previews and remove unused image files"
            git pull --rebase origin main
            git push
          fi
